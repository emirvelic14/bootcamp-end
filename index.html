<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Roboto:wght@300;400;500;700;900&display=swap"
    rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <title>Weather</title>
    <link rel="icon" href="data:,">
    <meta name="description" content="A simple global weather app.">
    <script defer src="script.js"></script>
</head>

<body>

    <div class="container">
        <div class="search-box">
            <i class="fa-solid fa-location-dot"></i>
            <input id="search-input" placeholder="Enter your location">
            <button id="search-button" class="fa-solid fa-magnifying-glass" aria-label="search"></button>
        </div>

        <ul tabindex="-1" id="match-list" aria-label="match list"></ul>

        <div id="weather-box">
            <img id="weather-image">
            <p id="temperature"></p>
            <button id="location-name"></button>
        </div>

        <div class="weather-details">
            <div class="humidity">
                <i class="fa-solid fa-water"></i>
                <div class="text">
                    <span id="humidity"></span>
                    <p>Humidity</p>
                </div>
            </div>
            <div class="wind">
                <i class="fa-solid fa-wind"></i>
                <div class="text">
                    <span id="wind"></span>
                    <p>Wind Speed</p>
                </div>
            </div>
        </div>

        <div class="not-found">
            <img src="images/404.png" alt="not found">
            <p>Oops! Invalid location :/</p>
        </div>

    </div>

</body>

</html>
